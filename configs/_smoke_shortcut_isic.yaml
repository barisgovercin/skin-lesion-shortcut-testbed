experiment: {name: smoke_shortcut_isic, seed: 42}
data:
  dataset: isic2020
  data_dir: data/raw/isic2020
  img_size: 224
  batch_size: 16
  num_workers: 4
  text_filter_level: DFilt
  text_max_length: 128
model:
  backbone: convnext_base
  pretrained: true
  text_model: emilyalsentzer/Bio_ClinicalBERT
  text_freeze: false
training: {epochs: 1, lr: 1.0e-5, weight_decay: 0.01}   # smoke: 1 epoch only
shortcut:
  leakage_ps: [1.0]                                       # smoke: single dose point
  methods: [naive]
  consistency_lambda: 1.0
  adversarial_lambda: 1.0
