experiment:
  name: large_vision_ham10000
  seed: 42

data:
  dataset: ham10000
  data_dir: data/raw/ham10000
  img_size: 224
  batch_size: 16  # ConvNext-Large is ~197M params; smaller batch to fit 16GB VRAM
  num_workers: 4

model:
  backbone: convnext_large  # matches the reference paper's backbone
  pretrained: true

training:
  epochs: 5
  lr: 1.0e-5
  weight_decay: 0.01
  save_dir: models/checkpoints/large_ham10000
